<style>
/* shortcut: light-dark() needs a browser from 2024 or later; add a fallback palette if an older one must work. */
:root{color-scheme:light dark;
--bg:light-dark(#f4f6f9,#0f1218);--panel:light-dark(#fff,#171b23);--panel2:light-dark(#eef1f5,#1f2530);--line:light-dark(#cbd2dd,#323a48);--text:light-dark(#141820,#f2f4f8);--muted:light-dark(#4c5666,#aeb7c6);--accent:light-dark(#1f55c4,#8ab4ff);--accent-ink:light-dark(#fff,#0b1730);--red:light-dark(#b3261e,#ff8f8a);--red-bg:light-dark(#fde8e6,#3a1b1d);--amber:light-dark(#7a5200,#f4c267);--amber-bg:light-dark(#fdf0d5,#3a2d12);--green:light-dark(#17693a,#7fdc9f);--tok:light-dark(#6b4a00,#ffe08a);--tok-bg:light-dark(#fdeeb9,#46391a);--shadow:0 10px 30px rgb(0 0 0/.35);--scrim:rgb(0 0 0/.6);

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs-body)/1.45 var(--font-ui);overflow:hidden}
button,input{font:inherit;color:inherit}

.top{background:var(--panel);border-bottom:1px solid var(--line);padding:var(--s-2) var(--s-3);display:flex;align-items:center;gap:var(--s-2)}

.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.script{font-size:var(--fs-script);line-height:1.4;margin:0 0 var(--s-3)}
.script.md{font-size:var(--fs-script-md);margin-bottom:var(--s-3)}
.script.sm{font-size:var(--fs-lead);margin-bottom:var(--s-2)}
.pbclose{border-top:1px solid var(--line);padding-top:var(--s-3)}
.pbmiss{display:flex;flex-wrap:wrap;gap:var(--s-1);align-items:center;margin:var(--s-1) 0 var(--s-2)}
.missing{min-height:var(--h-small);padding:var(--s-1) var(--s-2);font-size:var(--fs-small);background:var(--amber-bg);color:var(--amber);border:1px dashed var(--amber)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-2)}
#summary h3{font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:var(--s-3) 0 var(--s-1)}
#summary h3:first-child{margin-top:0}
#summary p{margin:0 0 var(--s-1);font-size:var(--fs-small)}
.tag{font-size:var(--fs-label);font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:var(--s-1)}
.warn,.banner{border-radius:var(--r-m);padding:var(--s-1) var(--s-2);font-weight:600;font-size:var(--fs-small);margin-bottom:var(--s-3)}
.warn{background:var(--red-bg);color:var(--red)}
.banner{background:var(--amber-bg);color:var(--amber)}
.note{color:var(--muted);font-size:var(--fs-small)}
.mini{display:inline-block;font-size:var(--fs-label);font-weight:600;padding:0 var(--s-1);border-radius:var(--r-pill);border:1px solid currentColor;margin:0 var(--s-1) 0 0;white-space:nowrap;color:var(--muted)}
.m-red{color:var(--red)}.m-amber{color:var(--amber)}.m-green{color:var(--green)}
.tok{display:inline;min-height:0;padding:0 var(--s-1);border-radius:var(--r-s);background:var(--tok-bg);color:var(--tok);border:1px dashed var(--tok);font:inherit}
.drop{background:none;border:0;padding:0;min-height:var(--h-small);color:var(--accent);font-weight:600;font-size:var(--fs-small);text-align:left}
.dropbody{margin:var(--s-0) 0 var(--s-3);padding:var(--s-2) var(--s-3);border-left:3px solid var(--line)}
.dots{display:flex;gap:var(--s-1);align-items:center;margin-bottom:var(--s-3)}
.dot{width:var(--h-small);height:var(--h-small);min-height:var(--h-small);padding:0;border-radius:50%;font-size:var(--fs-small)}
.dot.cur{border:2px solid var(--accent);font-weight:700}
.st-2{background:var(--red-bg)!important;color:var(--red)!important;border-color:var(--red)!important;font-weight:700}
.st-1{background:var(--amber-bg)!important;color:var(--amber)!important;border-color:var(--amber)!important;font-weight:700}
.st-0{border-color:var(--text);font-weight:700}
.btns{display:flex;gap:var(--s-2);margin:0 0 var(--s-3)}
.btns button{min-height:var(--h-action);min-width:110px}
label{display:block;font-size:var(--fs-small);color:var(--muted);margin:var(--s-1) 0 var(--s-0)}
#rail{border-left:1px solid var(--line);overflow:auto;padding:0 0 var(--s-3);background:var(--panel)}
.sec{width:100%;display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:var(--fs-label);letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted);padding:var(--s-2) var(--s-3);min-height:var(--h-target)}
.row-btn{width:100%;display:flex;gap:var(--s-2);align-items:center;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:var(--s-2) var(--s-3);min-height:var(--h-target);font-size:var(--fs-small)}
.row-btn:hover,.obj:hover,.sec:hover{background:var(--panel2)}
.row-btn .lbl{flex:1}
.row-btn .chev{color:var(--muted)}
.sdot{width:10px;height:10px;border-radius:50%;border:1px solid var(--muted);flex:none}
.sdot.s2{background:var(--red);border-color:var(--red)}
.sdot.s1{border:3px solid var(--amber)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.rowbody{padding:var(--s-2) var(--s-3) var(--s-3);border-bottom:1px solid var(--line);background:var(--bg);font-size:var(--fs-small)}
.rowbody p{margin:0 0 var(--s-1)}
.lvls{display:flex;gap:var(--s-1);margin-bottom:var(--s-1)}
.lvl,.listen{min-height:var(--h-small);padding:0 var(--s-2);font-size:var(--fs-small)}
.lvl.on{background:var(--panel2);font-weight:700}
.listen{display:block;width:100%;text-align:left;margin-top:var(--s-1)}

.pin{min-height:var(--h-small);padding:0 var(--s-2);font-size:var(--fs-small);margin-top:var(--s-1)}
.obj{display:block;width:100%;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;text-align:left;padding:var(--s-2) var(--s-3) var(--s-2) var(--s-5);min-height:var(--h-target);font-size:var(--fs-small)}
.pop{position:fixed;z-index:6;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow);overflow:auto;padding:var(--s-2)}
.pop.right{right:var(--s-2);top:58px;width:calc(30% - var(--s-4));min-width:340px;max-height:calc(100vh - 70px)}
.pop.left{top:58px;width:330px;max-height:calc(100vh - 70px)}
.menu{display:flex;width:100%;gap:var(--s-2);align-items:center;background:none;border:0;text-align:left;padding:var(--s-1) var(--s-2);min-height:var(--h-target);border-radius:var(--r-m)}

.pmenu .menu{min-height:36px;padding:var(--s-0) var(--s-2)}
.pmenu .note{font-size:var(--fs-label)}
.mhead{padding:var(--s-1) var(--s-2) var(--s-0);font-size:var(--fs-label);font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.pop.right.plan{width:440px}
.planrow{border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s-2);margin:0 0 var(--s-2)}

.planhead{display:flex;align-items:center;gap:var(--s-2);flex-wrap:wrap}
.pnum{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;border-radius:50%;background:var(--panel2);border:1px solid var(--line);font-size:var(--fs-label);font-weight:600}
.link{background:none;border:0;padding:var(--s-1) 0;min-height:var(--h-compact);color:inherit;text-decoration:underline;cursor:pointer;font-size:var(--fs-small)}

.seg{display:flex;gap:var(--s-1);flex-wrap:wrap;margin-bottom:var(--s-1)}
.seg button{min-height:var(--h-compact);padding:0 var(--s-2);font-size:var(--fs-label)}
.seg button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.planrow input{flex:1;min-width:90px;width:auto;margin:0;min-height:var(--h-compact);font-size:var(--fs-small)}
.nextmove{margin-bottom:var(--s-2)}
p{margin:0 0 var(--s-2)}
p:last-child{margin-bottom:0}
.grow{flex:1}
.add{font-weight:600;color:var(--accent)}
.mt-1{margin-top:var(--s-1)}.mt-2{margin-top:var(--s-2)}.mt-3{margin-top:var(--s-3)}.mb-3{margin-bottom:var(--s-3)}
.tight{margin:var(--s-0) 0}
.tag-amber{color:var(--amber)}
.proofmeta{margin:calc(var(--s-2)*-1) 0 var(--s-3)}
.legend{margin:var(--s-1) var(--s-2) 0}
.pop.right.morepop{width:240px;min-width:0}
.check{display:flex;gap:var(--s-1);align-items:center;margin:var(--s-2) 0}
.check input{width:auto;min-height:0}
.dropbody.flush{padding:0 0 0 var(--s-2)}
.planline{display:flex;gap:var(--s-2);justify-content:space-between;align-items:baseline;font-size:var(--fs-small);color:var(--muted);margin:0 0 var(--s-2)}
.pop.left.vmenu{width:min(760px,calc(100vw - 20px));columns:3 220px;column-gap:var(--s-2)}
.vmenu .menu{min-height:var(--h-compact);padding:var(--s-1) var(--s-2);font-size:var(--fs-small)}
.menu .k{color:var(--muted);font-size:var(--fs-label);width:14px}
.card{background:var(--panel2);border-radius:var(--r-m);padding:var(--s-2);margin-bottom:var(--s-2);font-size:var(--fs-small)}
.card p{margin:0 0 var(--s-1)}
.modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:10;padding:var(--s-4)}
.modal>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-l);padding:var(--s-4);width:680px;max-width:100%;max-height:90vh;overflow:auto}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-m);padding:var(--s-2);font:var(--fs-small)/1.45 var(--font-mono)}
kbd{border:1px solid var(--line);border-radius:var(--r-s);padding:0 var(--s-1);font:var(--fs-label) var(--font-mono)}
table{border-collapse:collapse;width:100%}td{padding:var(--s-1) var(--s-2);border-bottom:1px solid var(--line)}
.flex{display:flex;gap:var(--s-2);flex-wrap:wrap;align-items:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

des the list."}, {"p": "cro", "role": "Final say", "title": "CRO", "pain": "research", "why": "Owns the number and signs. Needs to know which accounts run a competitor before plan lock.", "lvl": 0, "hurts": "You can't see which security accounts run a competitor before plan lock, so territories get built on guesses.", "obs": "Security buyers are consolidating vendors, so the accounts running a competitor you can replace are your best pipeline."}], "ifNeeded": [{"p": "demand", "role": "Budget owner", "title": "VP of Demand Gen", "pain": "coverage", "why": "Bring in when RSA or Black Hat lists are part of the deal.", "lvl": 0, "hurts": "RSA and Black Hat lists come back with wrong titles and dead contacts, so event budget misses the security leaders you paid to reach.", "obs": "Security marketing leans on RSA and Black Hat, and the pipeline from them depends on how clean the list is before the show."}, {"p": "ciso", "role": "Security gate", "title": "CISO", "pain": "review", "why": "Your prospect sells security, so its own team will test any tool holding GTM data. Send the package early.", "lvl": 0, "hurts": "GTM tools that touch customer and prospect data reach your team for review after the deal is already in motion.", "obs": "Security companies get held to their own standard, so every GTM tool your sales team adds becomes a review for your team."}, {"p": "cfo", "role": "Budget owner", "title": "CFO", "pain": "spend", "why": "Bring in when the deal replaces data vendors.", "lvl": 0, "hurts": "Data contracts overlap across sales and marketing, and they renew before anyone checks what each one returns.", "obs": "Security vendors often pay for more than one contact database, and the overlap rarely gets measured before renewal."}], "skip": ["mops", "gtme", "cs", "channel"], "skipWhy": "Rarely decides this at a security vendor."}, "lex": {"accts": "security accounts", "acct": "security account", "aAcct": "a security account", "buyers": "security leaders", "rivals": "competitors", "using": "using", "use": "use", "gap": "their security stack and buying committee", "signal": "a new CISO", "custs": "security customers"}}, {"id": "ai", "label": "AI-Native B2B SaaS", "proofChain": ["ai", "cyber"], "verticalBuyers": "AI-native SaaS companies", "endBuyer": "a VP of Engineering or Head of AI", "endBuyerShort": "technical buyer", "triggerExamples": "a new Head of AI or an AI engineering job post", "signalExamples": "self-serve signups, website visits, AI hiring and CRM stage changes", "siteCheck": "an AI product launch or competitor logos", "eventDefault": "your next flagship event", "marketPain": "Self-serve volume outruns sales capacity, the category changes monthly, and many target accounts are too new to be well covered by a single data vendor.", "compliance": "Expect questions on model access and LLM data flows. Answer with SOC 2 Type II and ISO 42001, then route detail to the AE.", "partnerTypes": "partners", "partnerRecruit": "partner", "stories": ["OpenAI", "Anthropic", "Mistral AI", "ElevenLabs", "Sana"], "logos": ["Perplexity"], "motion": "Self-serve and API signups feeding a fast-growing enterprise sales team.", "plan": {"note": "Inbound outruns sales here. Start with whoever owns enrichment, then the builder, then revenue.", "thread": [{"p": "revops", "role": "First champion", "title": "Head of Sales Operations", "pain": "coverage", "why": "Signups pour in, and enrichment coverage decides which ones ever reach a rep.", "lvl": 0, "hurts": "Your newest accounts are startups that change fast, and standard providers miss them, so routing and follow-up break on the accounts that matter most.", "obs": "AI-native companies sell to other new companies, and those are the accounts standard databases cover worst."}, {"p": "gtme", "role": "Builder", "title": "GTM Engineer", "pain": "research", "why": "The category changes monthly, so custom research keeps breaking and this person fixes it.", "lvl": 2, "hurts": "Your research scripts call AI /* ---------- signals ---------- */
const dayMs = 864e5;
function freshness(sig){
  const d = sigDef(sig.id);
  if(!sig.date) return {k:"unk",t:"Date unknown",stale:false};
  const dt = new Date(sig.date+"T12:00:00"), now = new Date(); now.setHours(12,0,0,0);
  const diff = Math.round((dt-now)/dayMs);
  if(d.freshDays!=null){
    if(diff>=-d.freshDays) return {k:"fresh",t:"Fresh",stale:false};
    return {k:"stale",t:"Stale",stale:true};
  }
  if(d.upcomingDays!=null){
    if(diff<0) return {k:"stale",t:"Stale",stale:true};
    if(diff<=d.upcomingDays) return {k:"up",t:"Upcoming",stale:false};
    return {k:"early",t:"Too early",stale:false};
  }
  return {k:"date",t:sig.date,stale:false};
}
const freshClass = k => k==="fresh"||k==="up"?"m-green":k==="stale"?"m-red":k==="date"?"":"m-amber";
function fit(sig,pid){
  const d=sigDef(sig.id), f=freshness(sig), listed=!d.personas.length||d.personas.includes(pid);
  if(f.stale) return {n:0,t:"Weak"};
  const live=f.k==="fresh"||f.k==="up";
  if(listed&&live) return {n:2,t:"Strong"};
  if(listed||live) return {n:1,t:"Moderate"};
  return {n:0,t:"Weak"};
}
function leadSignal(pid){
  pid=pid||S.personaId;
  if(S.leadUid){const m=S.signals.find(s=>s.uid===S.leadUid);if(m)return m;}
  let best=null,score=-1;
  S.signals.forEach(s=>{if(freshness(s).stale)return;const n=fit(s,pid).n;if(n>=score){score=n;best=s;}});
  return best;
}
function liveLead(pid){const s=leadSignal(pid);return s&&!freshness(s).stale?s:null;}
function bestPersona(){
  const pts={};
  S.signals.forEach(s=>{if(freshness(s).stale)return;sigDef(s.id).personas.forEach((pid,i)=>{pts[pid]=(pts[pid]||0)+(i===0?3:i===1?2:1);});});
  let best=null,top=0;PERSONAS.forEach(p=>{if((pts[p.id]||0)>top){top=pts[p.id];best=p.id;}});
  if(best&&pts[S.personaId]===top) best=S.personaId;
  return best;
}

function fieldVal(key,sig){
  if(sig&&sig.values&&sig.values[key]) return sig.values[key];
  if(VERTICAL_TOKENS.includes(key)) return V()[key];
  if(key==="champion"||key==="championTeam"){
    const ch=champions().filter(x=>x.p!==S.personaId&&threadOf(x.p).name).pop();
    if(ch) return key==="champion"?threadOf(ch.p).name:persona(ch.p).team;
  }
  if(S.fields[key]) return S.fields[key];
  for(const s of S.signals){if(s.values[key]) return s.values[key];}
  if(key==="competitor"&&S.fields.competitors) return S.fields.competitors.split(",")[0].trim();
  if(key==="event") return V().eventDefault;
  return DEFAULTS[key]||"";
}
function fieldLabel(key,sig){
  if(sig){const f=sigDef(sig.id).fields.find(x=>x.key===key);if(f)return f.label;}
  if(LABELS[key]) return LABELS[key];
  for(const d of DATA.signals){const f=d.fields.find(x=>x.key===key);if(f)return f.label;}
  return key;
}
const isSignalOnly = key => !(key in LABELS);
function T(text,o){
  o=o||{};
  return esc(text).replace(/\{(\w+)\}/g,(m,key)=>{
    if(o.extra&&key in o.extra) return esc(o.extra[key]);
    const v=fieldVal(key,o.sig);
    if(v) return esc(v);
    const owner=o.sig&&sigDef(o.sig.id).fields.some(f=>f.key===key)?o.sig:S.signals.find(s=>sigDef(s.id).fields.some(f=>f.key===key));
    return `<button class="tok" data-act="jump" data-key="${key}" data-sig="${owner?owner.uid:""}" aria-label="Fill in ${esc(fieldLabel(key,o.sig))}">[${esc(fieldLabel(key,o.sig))}]</button>`;
  });
}
function plain(text,o){
  o=o||{};
  return String(text==null?"":text).replace(/\{(\w+)\}/g,(m,key)=>{
    if(o.extra&&key in o.extra) return o.extra[key];
    return fieldVal(key,o.sig)||`[${fieldLabel(key,o.sig)}]`;
  });
}

/* ---------- email ---------- */
// AI-writing tells from github.com/blader/humanizer (MIT), after Wikipedia's "Signs of AI writing". Only the ones a pattern can catch.
const TELLS=[[/[\u2014\u2013]| -- /,"dash"],[/[\u201C\u201D\u2018\u2019]/,"curly quotes"],
  [/\b(?:actually|additionally|align(?:s|ed)? with|bolster(?:ed)?|crucial|deep dive|delve|enduring|enhance[sd]?|garner|highlight(?:s|ed)?|interplay|intricate|intricacies|key|landscape|meticulous(?:ly)?|pivotal|quietly|robust|showcases?|tapestry|testament|underscores?|valuable|vibrant)\b/i,null],
  [/\bnot (?:just|only|merely)\b|\b(?:isn't|is not|it's not)\b[^.]*, it's\b|\brather than\b/i,"not X but Y"],
  [/\b(?:the real (?:question|problem|issue)|at its core|in reality|what really matters|fundamentally|the heart of)\b/i,"deep-sounding saying"],
  [/\b(?:let's (?:dive|explore|break)|here's what you need|without further ado|quick note|heads up|here's the thing|real talk)\b|\bhonestly\?/i,"run-up"],
  [/\b(?:plays a (?:key|crucial|pivotal) role|setting the stage|evolving landscape|game[- ]changer|the future looks bright)\b/i,"inflated claim"],
  [/, (?:highlighting|underscoring|emphasizing|ensuring|reflecting|symbolizing|contributing to|fostering|showcasing)\b/i,"-ing rider"],
  [/\b(?:groundbreaking|renowned|seamless(?:ly)?|cutting[- ]edge|world[- ]class|best[- ]in[- ]class|unlock|supercharge|revolutioni[sz]e|profound|nestled|breathtaking|stunning)\b/i,"sales language"],
  [/\b(?:serves as|stands as|functions as|boasts)\b/i,"\"serves as\" instead of \"is\""],
  [/\b(?:I hope (?:this|you)|let me know|great question|certainly!|would you like|touch(?:ing)? base|circle back|just (?:checking|following) in)\b/i,"filler"]];
function emailTells(t){return TELLS.map(([r,l])=>{const m=t.match(r);return m?l||`"${m[0].toLowerCase()}"`:null;}).filter(Boolean);}
function emailDraft(p){
  const c=call(p.id);if(c.draft)return c.draft;
  const a=activePain(p.id), pain=a||p.pains.find(x=>x.id===leadPainId(p.id)), r=roleInfo(p.id), h=hookFor(p), u=useCase(pain.useCase);
  let obs=r.obs, subj=pain.subj, src=`Written for a ${r.title} in ${V().label}`;
  if(a){obs="You told me "+a.say+".";src="From this call";}
  else if(h.sig){obs=plain(h.text.replace(/^Hi \{name\}, this is Donta\. /,""),{sig:h.sig});subj=plain(sigDef(h.sig.id).subj,{sig:h.sig});src="From signal: "+sigDef(h.sig.id).label;}
  const problem=(a?capFirst(a.so)+".":r.hurts)+" "+r.costs;
  const pr=resolveProof(pain.useCase), proof=pr?proofText(pr):"";
  const company=pr?pr.proof.company:"";
  const cta=`Let's take 20 minutes with {ae} on {slot1} or {slot2}${company?`, and I'll bring how ${company} set theirs up`:", and I'll bring a plan built for {company}"}.`;
  const body=["Hi {name},",obs,problem,capFirst(fillFrame(u.email,p.id)),cta,"Donta"].map(x=>plain(x)).join("\n\n");
  return {subject:capFirst(plain(fillFrame(subj,p.id))),body,src,proof};
}
function emailPop(p){
  const c=call(p.id), e=emailDraft(p);
  return `<div class="pop right" role="dialog" aria-label="Email" id="emailpop"><h2>Email to ${esc(S.fields.name||p.short)}</h2><p class="note">${esc(c.draft?"Edited by you":e.src)}</p>
  ${(()=>{const t=emailTells(e.subject+"\n"+e.body);return t.length?`<p class="warn">Reads as AI-written: ${esc(t.join(", "))}. Say it plainly.</p>`:"";})()}
  <label for="em-subj">Subject</label><input id="em-subj" data-bind="emailSubj" value="${esc(e.subject)}">
  <label for="em-body">Email</label><textarea id="em-body" data-bind="emailBody" rows="16">${esc(e.body)}</textarea>
  <div class="flex mt-3"><button class="primary" data-act="emailCopy">${S.emailCopied?"Copied":"Copy"}</button><button data-act="emailOpen">Open in email</button>${c.draft?`<button data-act="emailReset">Reset</button>`:""}</div></div>`;
}

    const open=S.addGroup===g.group;
    h+=`<button class="menu" data-act="addGroup" data-id="${esc(g.group)}" aria-expanded="${open}"><span class="grow">${esc(g.group)} <span class="note">(${g.items.length})</span></span><span>${open?"▴":"▾"}</span></button>`;
    if(open) h+=`<div class="dropbody flush">`+g.items.map(d=>{const added=d.id!=="custom"&&S.signals.some(s=>s.id===d.id);return `<button class="menu" data-act="addSig" data-id="${d.id}" ${added?"disabled":""}>${added?"✓ ":"+ "}${esc(d.label)}${d.personas.includes(p.id)?' <span class="mini m-green">Fits</span>':""}</button>`;}).join("")+`</div>`;
  });
  return h;
}
function catalog(){
  const p=P(), order=[...new Set(DATA.signals.map(s=>s.group))], out=[];
  order.forEach(g=>{
    const items=DATA.signals.filter(s=>s.group===g&&(!s.verticals||s.verticals.includes(S.verticalId)));
    items.sort((a,b)=>(b.personas.includes(p.id)?1:0)-(a.personas.includes(p.id)?1:0));
    if(items.length) out.push({group:g,items});
  });
  return out;
}
function popLeft(id){const b=document.querySelector(`[data-act=pop][data-id=${id}]`);return b?Math.round(b.getBoundingClientRect().left):10;}
function renderModal(){
  const el=document.getElementById("modal");
  if(!S.modal){el.innerHTML="";return;}
  if(S.modal==="help"){
    const rows=[["← / →","Previous / next step"],["Y / S / N","Mark Pain / Some / No pain"],["Enter","Next question"],["↑ / ↓","Previous / next question"],["O","Open objections"],["H","Objection handled, return to place"],["P, then 1-9 or 0","Choose a persona"],["V","Next vertical"],["G","Signals"],["B","Brief"],["E","Email"],["T","Start or pause timer"],["Esc","Close or leave a field"]];
    el.innerHTML=`<div class="modal"><div role="dialog" aria-modal="true" aria-label="Keyboard shortcuts"><h2>Keyboard shortcuts</h2><table>${rows.map(r=>`<tr><td><kbd>${esc(r[0])}</kbd></td><td>${esc(r[1])}</td></tr>`).join("")}</table><button class="mt-3" data-act="closeModal">Close</button></div></div>`;
    return;
  }
  if(S.modal==="end"){
    const opts=["Meeting booked","Follow-up","Referred","Not now","Not a fit"];
    el.innerHTML=`<div class="modal"><div role="dialog" aria-modal="true" aria-label="End call"><h2>How did the call end?</h2><div class="flex">${opts.map(o=>`<button class="primary" data-act="outcome" data-v="${o}">${o}</button>`).join("")}</div><button class="mt-3" data-act="closeModal">Back to call</button></div></div>`;
    return;
  }
  el.innerHTML=`<div class="modal"><div role="dialog" aria-modal="true" aria-label="Call Summary"><h2>Call Summary</h2><div id="summary">${summarySections().map(([h,l])=>`<h3>${esc(h)}</h3>`+l.map(x=>`<p>${esc(x)}</p>`).join("")).join("")}</div><div class="flex"><button class="primary" data-act="copy">${S.copied?"Copied":"Copy"}</button><button data-act="newCall">New Call</button><button data-act="closeModal">Back to call</button></div></div></div>`;
}
function summarySections(){
  const worked=PERSONAS.filter(p=>S.calls[p.id]&&(S.calls[p.id].step>0||Object.keys(S.calls[p.id].q).length||p.id===S.personaId));
  const multi=worked.length>1, f=S.fields, val=k=>fieldVal(k);
  const line=(l,v)=>v?`${l}: ${v}`:"";
  const pains=[],ucs=[],proofs=[],notes=[],compNotes=[];
  worked.forEach(p=>{
    const c=call(p.id), pre=multi?p.short+": ":"";
    confirmedPains(p).forEach(x=>pains.push(`${pre}${x.title} (${x.score===2?"Pain":"Some"})${x.words?` | "${x.words}"`:""}${x.dollar?` | ${x.dollar}`:""}`));
    const a=activePain(p.id);
    if(a){
      pains.push(pre+stakesLine(p.id));
      ucs.push(pre+useCase(a.useCase).name);
      const r=resolveProof(a.useCase);
      if(r&&!proofs.includes(r.proof.line)) proofs.push(r.proof.line+(r.cross?" (cross-vertical)":""));
    }
    const qs=questions(p.id);
    Object.keys(c.q).forEach(k=>{
      const e=c.q[k];if(!e.words||!e.words.trim()||e.score>0)return;
      if(k==="comp"){compNotes.push(e.words.trim());return;}
      const q=qs.find(x=>x.key===k);
      notes.push(`${pre}${q?plain(q.text,{sig:q.sig})+" ":""}"${e.words.trim()}"`);
    });
  });
  const emails=worked.map(p=>call(p.id).email).filter(Boolean), att=worked.map(p=>call(p.id).attendees).filter(Boolean);
  const sigs=S.signals.map(s=>{const d=sigDef(s.id),v=d.fields.map(x=>s.values[x.key]).filter(Boolean).join(", ");return `${d.label}${v?": "+v:""} (${freshness(s).t}${s.confirmed?", confirmed on call":", not confirmed"}${s.source?", source: "+s.source:""})`;});
  const objs=S.log.map(o=>`${o.label}: ${o.result} (during ${o.step})`);
  const sections=[
    ["Prospect",[line("Contact",[f.name,f.company].filter(Boolean).join(", ")),line("Role",worked.map(p=>p.short).join(", ")),line("Vertical",V().label),line("Core ICP",f.icp),line("Tier 1",f.tier1),line("Call length",fmtTime())]],
    ["Next step",[line("Outcome",S.outcome||"Not set"),line("Meeting",S.meeting?S.meeting+(f.ae?" with "+f.ae:""):""),line("Meeting plan",plain(meetingPlan(P(),true))),line("Email",emails.join(", ")),line("Attendees",att.join(", "))]],
    ["Account thread",threadLines()],["Competition and current state",[line("Competitors",f.competitors),line("Current tools",f.tools)].concat(compNotes.map(x=>`They said: "${x}"`))],
    ["Pains",pains],
    ["Solution",[line("Use case",ucs.join("; "))].concat(proofs.map(x=>"Proof used: "+x))],
    ["Signals",sigs],
    ["Objections",objs],
    ["Other notes",notes]
  ];
  return sections.map(([h,l])=>[h,l.filter(Boolean)]).filter(([h,l])=>l.length);
}
function summaryText(){
  return "CLAY S2 CALL SUMMARY\n\n"+summarySections().map(([h,l])=>h.toUpperCase()+"\n"+l.join("\n")).join("\n\n");
}
function fmtTime(){
  const t=S.timer, ms=t.elapsed+(t.running?Date.now()-t.started:0), s=Math.floor(ms/1000);
  return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
let keyboardNav=true;
document.addEventListener("pointerdown",()=>{keyboardNav=false;},true);
document.addEventListener("keydown",e=>{if(e.key==="Tab")keyboardNav=true;},true);
function render(){
  syncVertical();
  const a=document.activeElement, id=a&&a.id, start=a&&a.selectionStart, end=a&&a.selectionEnd, hadModal=!!document.querySelector(".modal");
  // Keep keyboard focus across redraws. Mouse clicks skip this, so Enter still means "next question" after one.
  const key=a&&!id&&a.dataset&&a.dataset.act&&keyboardNav?["act","id","step","key","v","uid"].filter(k=>a.dataset[k]!=null).map(k=>`[data-${k}="${CSS.escape(a.dataset[k])}"]`).join(""):null;
  const q=[["rail",document.getElementById("rail")],["say",document.getElementById("say")],["pop",document.querySelector(".pop")]].map(([k,e])=>[k,e?e.scrollTop:0]);
  renderTop();renderCenter();renderRail();renderPop();renderModal();
  const m={rail:document.getElementById("rail"),say:document.getElementById("say"),pop:document.querySelector(".pop")};
  q.forEach(([k,v])=>{if(m[k])m[k].scrollTop=v;});
  if(id){const n=document.getElementById(id);if(n&&n.focus){n.focus();try{if(start!=null&&n.setSelectionRange)n.setSelectionRange(start,end);}catch(e){}}}
  else if(key){const n=document.querySelector(key);if(n)n.focus();}
  document.getElementById("app").inert=!!S.modal;
  if(S.modal&&!hadModal){const n=document.querySelector(".modal button");if(n)n.focus();}
  if(!S.modal&&hadModal)document.querySelector('[data-act="end"]').focus();
}

/* ---------- actions ---------- */
function closeObj(result){if(S.openObj){S.openObj.entry.result=result;S.openObj=null;}}
function goto(i){closeObj("Moved on");call().step=Math.max(0,Math.min(5,i));S.detail=false;S.optOpen=false;render();const s=document.getElementById("say");if(s)s.scrollTop=0;}
function callStarted(){return Object.keys(S.thread).length>0||S.signals.length>0||Object.values(S.calls).some(c=>c.step>0||Object.keys(c.q).length>0);}
function selectVertical(id){S.verticalId=id;S.pop=null;syncVertical();if(!callStarted())S.personaId=plan().thread[0].p;render();}
function setThread(pid,status){
  S.thread[pid]=Object.assign({name:""},S.thread[pid],{status});
  render();
}
function setPersona(id){if(id!==S.personaId&&Object.keys(S.thread).length){call(S.personaId).name=S.fields.name||"";const n=threadOf(id).name||call(id).name;if(n)S.fields.name=n;else delete S.fields.name;}if(id!==S.personaId){S.personaId=id;closeObj("Moved on");S.detail=false;S.objGroup=null;}S.pop=null;call();render();}
function openObj(id){
  const o=stockpile().find(x=>x.id===id);if(!o)return;
  closeObj("Moved on");
  const entry={id:o.id,label:o.label,step:STEPS[call().step],result:"Open"};S.log.push(entry);
  S.openObj={id:o.id,obj:o,entry,resisted:false};
  render();const s=document.getElementById("say");if(s)s.scrollTop=0;
}
function handled(){if(!S.openObj)return;S.openObj.entry.result=S.openObj.resisted?"Still resisting, then handled":"Handled";S.openObj=null;render();}
function addSignal(id){
  const uid=S.uid++;S.signals.push({uid,id,values:{},date:"",source:"",confirmed:false});S.sigOpen=uid;S.addOpen=false;S.addGroup=null;render();
  const f=sigDef(id).fields[0], e=f&&document.getElementById(`sf-${uid}-${f.key}`);if(e)e.focus();
}
function toggleTimer(){const t=S.timer;if(t.running){t.elapsed+=Date.now()-t.started;t.running=false;}else{t.started=Date.now();t.running=true;}render();}
function newCall(){
  const keep={ae:S.fields.ae,slot1:S.fields.slot1,slot2:S.fields.slot2};
  S.icpQ=false;
  Object.assign(S,freshCall());S.fields={};Object.keys(keep).forEach(k=>{if(keep[k])S.fields[k]=keep[k];});S.personaId=plan().thread[0].p;
  Object.assign(S,{modal:null,openObj:null,pop:null,otherTime:false,copied:false,railRole:null,emailCopied:false,detail:false,objGroup:null,sigOpen:null,addOpen:false,addGroup:null,optOpen:false});render();
}
function toggleTheme(){
  const r=document.documentElement, cur=r.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark");
  r.setAttribute("data-theme",cur==="dark"?"light":"dark");S.pop=null;render();
}
function copy(){
  const t=summaryText(), done=()=>{S.copied=true;render();};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));}else fallbackCopy(t,done);
}
function fallbackCopy(t,done){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");}catch(e){}a.remove();done();}
function openObjections(){S.railObj=true;if(!S.objGroup)S.objGroup=P().short;render();const b=document.querySelector(".obj");if(b)b.focus();}

document.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");
  if(S.pop&&!ev.target.closest("#pop")&&!(b&&b.dataset.act==="pop")&&!(b&&b.dataset.act==="jump")){S.pop=null;if(!b){render();return;}}
  if(!b||b.disabled)return;
  const a=b.dataset.act, d=b.dataset;
  const acts={
    pop:()=>{S.pop=S.pop===d.id?null:d.id;render();},
    persona:()=>setPersona(d.id),
    vertical:()=>selectVertical(d.id),
    threadState:()=>setThread(d.id,d.v),
    planMore:()=>{S.planMore=!S.planMore;render();},
    goto:()=>goto(+d.step),
    mark:()=>mark(curQ(),+d.score),
    pickQ:()=>{call().qKey=d.key;render();},
    askQ:()=>{const c=call();c.qKey=d.key==="icp"||d.key==="comp"?(d.key==="icp"?(S.icpQ=true,"icp"):"comp"):d.key;c.step=1;render();},
    nextQ,
    wrong:()=>{S.log.push({label:"Wrong person",step:STEPS[call().step],result:"Logged"});S.pop="persona";render();},
    cold:()=>{const c=call();c.cold=!c.cold;render();},
    useDefault:()=>{const c=call();c.useDefault=!c.useDefault;render();},
    optOpen:()=>{S.optOpen=!S.optOpen;render();},
    detail:()=>{S.detail=!S.detail;render();},
    slot:()=>{S.meeting=fieldVal(d.v);call().step=5;S.otherTime=false;render();},
    otherTime:()=>{S.otherTime=true;render();const e=document.getElementById("otherTime");if(e)e.focus();},
    useOther:()=>{if(S.meeting.trim()){call().step=5;S.otherTime=false;render();}},
    booked:()=>{S.outcome="Meeting booked";S.modal="summary";if(S.timer.running)toggleTimer();render();},
    end:()=>{S.modal="end";render();},
    outcome:()=>{S.outcome=d.v;S.modal="summary";if(S.timer.running)toggleTimer();render();},
    closeModal:()=>{S.modal=null;S.copied=false;render();},
    help:()=>{S.pop=null;S.modal="help";render();},
    theme:toggleTheme,
    timer:toggleTimer,
    timerReset:()=>{S.timer={running:false,started:0,elapsed:0};S.pop=null;render();},
    railPain:()=>{S.railPain=!S.railPain;render();},
    railRole:()=>{S.railRole=!(S.railRole!=null?S.railRole:call().step<=1);render();},
    lvl:()=>{call().lvl=+d.id;render();},
    listen:()=>{const c=call(),k="listen:"+d.id;if(c.q[k])delete c.q[k];else c.q[k]={pain:d.id,score:2,t:S.seq++,words:""};render();},
    writeEmail:()=>{S.pop="email";render();},
    emailCopy:()=>{const e=emailDraft(P()),t="Subject: "+e.subject+"\n\n"+e.body,done=()=>{S.emailCopied=true;render();};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(done,()=>fallbackCopy(t,done));else fallbackCopy(t,done);},
    emailOpen:()=>{const e=emailDraft(P());location.href="mailto:"+encodeURIComponent(call().email)+"?subject="+encodeURIComponent(e.subject)+"&body="+encodeURIComponent(e.body);},
    emailReset:()=>{delete call().draft;S.emailCopied=false;render();},
    railObj:()=>{S.railObj=!S.railObj;render();},
    painOpen:()=>{const c=call();c.painOpen=c.painOpen===d.id?null:d.id;render();},
    pin:()=>{const c=call();c.pinned=c.pinned===d.id?null:d.id;render();},
    objGroup:()=>{S.objGroup=S.objGroup===d.id?null:d.id;render();},
    obj:()=>openObj(d.id),
    objHandled:handled,
    objResist:()=>{if(!S.openObj)return;S.openObj.resisted=true;S.openObj.entry.result="Still resisting";S.resist++;render();},
    objRoute:()=>{closeObj("Switched to "+persona(d.to).short);setPersona(d.to);},
    sigOpen:()=>{const u=+d.uid;S.sigOpen=S.sigOpen===u?null:u;render();},
    addOpen:()=>{S.addOpen=!S.addOpen;render();},
    addGroup:()=>{S.addGroup=S.addGroup===d.id?null:d.id;render();},
    addSig:()=>addSignal(d.id),
    setLead:()=>{const u=+d.uid;S.leadUid=S.leadUid===u?null:u;render();},
    rmSig:()=>{const u=+d.uid;S.signals=S.signals.filter(s=>s.uid!==u);if(S.leadUid===u)S.leadUid=null;render();},
    jump:()=>{
      const k=d.key;
      if(isSignalOnly(k)&&d.sig){S.pop="signals";S.sigOpen=+d.sig;render();const e=document.getElementById(`sf-${d.sig}-${k}`);if(e)e.focus();return;}
      S.pop="setup";render();const e=document.getElementById("f-"+k);if(e)e.focus();
    },
    copy,newCall
  };
  if(acts[a])acts[a]();
});
document.addEventListener("input",ev=>{
  const e=ev.target, b=e.dataset.bind;if(!b)return;
  const c=call(), uid=+e.dataset.uid, sig=S.signals.find(s=>s.uid===uid);
  if(b==="words"){const k=e.dataset.qkey,x=c.q[k]||(c.q[k]={pain:e.dataset.pain||null});x.words=e.value;}
  else if(b==="field") S.fields[e.dataset.key]=e.value;
  else if(b==="dollar") c.dollar[e.dataset.id]=e.value;
  else if(b==="threadName"){const t=S.thread[e.dataset.id];t.name=e.value;if(e.dataset.id===S.personaId)S.fields.name=e.value;}
  else if(b==="meeting") S.meeting=e.value;
  else if(b==="email") c.email=e.value;
  else if(b==="attendees") c.attendees=e.value;
  else if(b==="emailSubj"||b==="emailBody"){const p=P(),x=c.draft||(c.draft=Object.assign({},emailDraft(p)));x[b==="emailSubj"?"subject":"body"]=e.value;S.emailCopied=false;}
  else if(b==="sigField") sig.values[e.dataset.key]=e.value;
  else if(b==="sigDate") sig.date=e.value;
  else if(b==="sigSource") sig.source=e.value;
  else if(b==="sigConfirm") sig.confirmed=e.checked;
  render();
});
document.addEventListener("keydown",ev=>{
  const el=ev.target, typing=el&&((el.tagName==="INPUT"&&el.type!=="checkbox")||el.tagName==="TEXTAREA");
  if(ev.key==="Escape"){
    if(typing){el.blur();return;}
    if(S.pop){S.pop=null;render();return;}
    if(S.modal&&S.modal!=="summary"){S.modal=null;render();return;}
    if(S.openObj){handled();return;}
    return;
  }
  if(typing){
    if(ev.key==="Enter"&&call().step===1&&!S.openObj&&el.closest("#say")&&/^(words|dollar|field)$/.test(el.dataset.bind||"")){ev.preventDefault();el.blur();nextQ();}
    return;
  }
  if(ev.metaKey||ev.ctrlKey||ev.altKey||S.modal) return;
  const k=ev.key.toLowerCase(), c=call();
  if(S.pop==="persona"&&/^[0-9]$/.test(k)){const i=k==="0"?9:+k-1;const o=planOrder();if(o[i])setPersona(o[i].id);ev.preventDefault();return;}
  if(k==="arrowleft"){goto(c.step-1);ev.preventDefault();}
  else if(k==="arrowright"){goto(c.step+1);ev.preventDefault();}
  else if((k==="arrowup"||k==="arrowdown")&&c.step===1&&!S.openObj){const qs=questions(),i=qs.findIndex(q=>q.key===curQ().key),n=qs[i+(k==="arrowup"?-1:1)];if(n){c.qKey=n.key;render();}ev.preventDefault();}
  else if(k==="enter"&&c.step===1&&!S.openObj&&el.tagName!=="BUTTON"){nextQ();}
  else if((k==="y"||k==="s"||k==="n")&&c.step===1&&!S.openObj){const q=curQ();if(q.pain)mark(q,{y:2,s:1,n:0}[k]);}
  else if(k==="o"){ev.preventDefault();openObjections();}
  else if(k==="g"){S.pop=S.pop==="signals"?null:"signals";render();}
  else if(k==="b"){S.pop=S.pop==="brief"?null:"brief";render();}
  else if(k==="e"){S.pop=S.pop==="email"?null:"email";render();}
  else if(k==="h"){handled();}
  else if(k==="v"){const i=DATA.verticals.findIndex(v=>v.id===S.verticalId);selectVertical(DATA.verticals[(i+1)%DATA.verticals.length].id);}
  else if(k==="p"){S.pop=S.pop==="persona"?null:"persona";render();}
  else if(k==="t"){toggleTimer();}
});
setInterval(()=>{const e=document.getElementById("timer");if(e)e.textContent=fmtTime();},500);
render();
</script>
